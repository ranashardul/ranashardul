<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Contributions Globe — Shardul Rana</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html,body { height:100%; margin:0; }
    body { display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg,#0f172a,#061424); color:#e6eef8; font-family:Inter,Arial, sans-serif; }
    #container { width:100%; max-width:960px; height:640px; border-radius:12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); overflow:hidden; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(0,0,0,0.05)); padding:18px; }
    header { display:flex; gap:12px; align-items:center; margin-bottom:12px; }
    header h1 { font-size:20px; margin:0; color: #ffb3b8; }
    #canvas { width:100%; height:100%; display:block; }
    .legend { position:absolute; right:18px; top:18px; background: rgba(0,0,0,0.35); padding:8px 12px; border-radius:8px; font-size:13px; }
    .centerInfo { text-align:center; color:#cfe8ff; margin-top:12px; font-size:14px; }
    a { color:#9be7ff }
  </style>
</head>
<body>
  <div id="container">
    <header>
      <h1>🌍 Contributions Globe — Shardul Rana</h1>
      <div style="flex:1"></div>
      <a href="https://github.com/ranashardul" target="_blank" style="color:#ffd1d7">GitHub</a>
    </header>
    <div id="canvas"></div>
    <div class="centerInfo">The globe maps your GitHub activity-graph image as a texture. Rotate with mouse/touch.</div>
  </div>

  <!-- THREE.JS from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.156.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    // SETTINGS: change username or theme here:
    const GITHUB_USERNAME = "ranashardul"; // <- change if you rename your account
    const ACTIVITY_IMAGE = `https://activity-graph.herokuapp.com/graph?username=${GITHUB_USERNAME}&theme=react-dark&hide_border=true`;

    const container = document.getElementById('canvas');
    const width = container.clientWidth || 900;
    const height = container.clientHeight || 560;

    // Scene
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
    camera.position.set(0, 0, 2.8);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);
    const dir = new THREE.DirectionalLight(0xffffff, 0.6);
    dir.position.set(5, 3, 5);
    scene.add(dir);

    // Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 1.6;
    controls.maxDistance = 7;
    controls.rotateSpeed = 0.6;

    // Sphere geometry + texture (activity image)
    const geometry = new THREE.SphereGeometry(1, 64, 64);
    const loader = new THREE.TextureLoader();

    loader.crossOrigin = "";
    loader.load(ACTIVITY_IMAGE, (texture) => {
      // The activity graph is rectangular; we tile/adjust UVs to map it artistically
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(1.0, 0.5); // tweak tiling
      const material = new THREE.MeshStandardMaterial({
        map: texture,
        metalness: 0.05,
        roughness: 0.8,
      });
      const globe = new THREE.Mesh(geometry, material);
      scene.add(globe);

      // Add subtle glass overlay
      const overlayMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        metalness: 0,
        roughness: 0.2,
        transmission: 0.25,
        transparent: true,
        opacity: 0.08
      });
      const glass = new THREE.Mesh(geometry.clone(), overlayMat);
      glass.scale.set(1.009,1.009,1.009);
      scene.add(glass);

      // Animate
      const animate = () => {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.002; // slow auto-rotate
        controls.update();
        renderer.render(scene, camera);
      };
      animate();
    }, undefined, (err) => {
      console.error('Texture load error:', err);
    });

    // Resize handling
    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
