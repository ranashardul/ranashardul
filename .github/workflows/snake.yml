name: "Generate Snake"
on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC (change if you like)

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake.svg
        uses: Platane/snk@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          filename: snake.svg
          # The action currently uses the token to read contributions and create an SVG.
          # Platane/snk may accept additional inputs in future releases for style customization.

      - name: Commit generated snake.svg
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add snake.svg || true
          git commit -m "chore: update snake.svg [skip ci]" || echo "no changes"
          git push origin HEAD:main || echo "push failed"
